<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Looper Pro</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#181a1f;--panel2:#202329;--line:#30343c;--text:#f2f3f5;--muted:#9298a3;--accent:#b9c5d5;--record:#e46b72;--play:#80c8a0;--amber:#d9ad70;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% -20%,#252a33 0,transparent 55%),var(--bg);color:var(--text);overflow:hidden}.shell{height:100%;max-width:980px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom)}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex:none}.brand{font-size:15px;letter-spacing:.18em;font-weight:750}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.22em;margin-top:5px;font-weight:600}.header-actions{display:flex;align-items:center;gap:14px}.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#68717c}.dot.ready{background:var(--play);box-shadow:0 0 10px #80c8a055}button{font:inherit;color:inherit;cursor:pointer}.primary,.quiet{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:10px 14px;font-weight:650;font-size:12px;transition:.16s}.primary:hover,.quiet:hover{background:#292d35;border-color:#48505c}.primary{background:#dce2e9;color:#17191d;border-color:#dce2e9}.primary:hover{background:white}.content{flex:1;overflow:auto;padding:28px 0 36px}.intro{display:flex;justify-content:space-between;align-items:end;margin:0 0 20px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.17em;text-transform:uppercase}.intro h1{font-size:25px;letter-spacing:-.04em;margin:8px 0 0;font-weight:650}.intro p{font-size:12px;color:var(--muted);margin:7px 0 0}.tracks{display:grid;gap:14px}.track{background:linear-gradient(145deg,#1c1e23,#17191d);border:1px solid var(--line);border-radius:14px;padding:17px 18px 18px;box-shadow:0 10px 28px #0002}.track-head{display:flex;align-items:center;gap:10px}.track-name{font-size:12px;font-weight:700;letter-spacing:.02em}.badge{font-size:9px;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);padding:5px 7px;border-radius:5px}.track.recording{border-color:#9c4c54}.track.recording .badge{color:#f18a91;border-color:#78434a}.track.playing{border-color:#547d66}.track.playing .badge{color:#9bd2ae;border-color:#456652}.duration{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.wave{height:54px;margin:17px 0 12px;border-radius:7px;background:#111317;overflow:hidden}.wave canvas{width:100%;height:100%;display:block}.volume{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:0 0 18px}.volume input{flex:1;accent-color:#b9c5d5;height:3px}.volume output{width:38px;text-align:right;font-variant-numeric:tabular-nums}.group-title{font-size:9px;color:#8f96a1;text-transform:uppercase;letter-spacing:.16em;margin:16px 0 8px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.control{min-height:44px;background:#22252b;border:1px solid #343841;border-radius:8px;color:#d9dce1;font-size:11px;font-weight:650}.control:hover:not(:disabled){background:#2b2f36;border-color:#505762}.control:disabled{opacity:.35;cursor:not-allowed}.control.record{color:#f18a91}.control.play{color:#9bd2ae}.control.overdub{color:#e2bf8d}.control.delete{color:#a4a9b0;background:transparent}.notice{font-size:11px;color:var(--muted);line-height:1.55;max-width:430px}.empty{padding:42px 20px;text-align:center;border:1px dashed #353942;border-radius:12px;color:var(--muted);font-size:12px}.error{color:#f18a91;font-size:11px;min-height:16px;margin-top:12px}@media(max-width:600px){.shell{padding-left:14px;padding-right:14px}header{height:66px}.content{padding-top:22px}.intro h1{font-size:21px}.intro .notice{display:none}.track{padding:15px}.controls{gap:6px}.control{font-size:10px}.wave{height:48px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand">LOOPER PRO<small>LIVE LOOP STUDIO</small></div><div class="header-actions"><div class="status"><span class="dot" id="micdot"></span><span id="micstatus">Microphone off</span></div><button class="primary" id="micbtn" onclick="enableMic()">Enable microphone</button></div></header>
<main class="content"><section class="intro"><div><div class="eyebrow">Audio workspace</div><h1>Build a loop, layer by layer.</h1><p>Record a phrase, add an overdub, and shape your sound.</p></div><div class="notice">Microphone access is required. Use headphones to prevent speaker feedback.</div></section><div class="tracks" id="tracks"></div><div class="error" id="error"></div></main>
</div>
<script>
let audioContext, microphone, tracks=[], nextId=0;
function enableMic(){if(!navigator.mediaDevices?.getUserMedia){showError('Microphone access requires a secure HTTPS connection and a supported browser.');return}try{audioContext=new(window.AudioContext||window.webkitAudioContext)()}catch(e){showError(e.message);return}navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(s=>{microphone=s;document.getElementById('micdot').classList.add('ready');document.getElementById('micstatus').textContent='Microphone ready';document.getElementById('micbtn').textContent='Microphone enabled';document.getElementById('micbtn').disabled=true;addTrack()}).catch(e=>showError(e.name+': '+e.message))}
function showError(message){document.getElementById('error').textContent=message}
function addTrack(){const t={id:++nextId,state:'empty',buffer:null,undo:null,volume:1,source:null,recorder:null,chunks:[],gain:null};tracks.push(t);render()}
function render(){const root=document.getElementById('tracks');root.innerHTML='';if(!tracks.length){root.innerHTML='<div class="empty">No tracks yet. Enable your microphone to start.</div>';return}tracks.forEach(t=>{const busy=['recording','playing','overdubbing'].includes(t.state),has=!!t.buffer,el=document.createElement('article');el.className='track '+(t.state==='recording'?'recording':t.state==='playing'?'playing':'');el.innerHTML=`<div class="track-head"><span class="track-name">TRACK ${String(t.id).padStart(2,'0')}</span><span class="badge">${t.state.toUpperCase()}</span><span class="duration">${has?t.buffer.duration.toFixed(2)+' sec':'—'}</span></div><div class="wave"><canvas id="wave-${t.id}"></canvas></div><label class="volume"><span>LEVEL</span><input aria-label="Track ${t.id} volume" type="range" min="0" max="1.5" step="0.01" value="${t.volume}" oninput="setVolume(${t.id},this.value)"><output id="vol-${t.id}">${Math.round(t.volume*100)}%</output></label><div class="group-title">Transport</div><div class="controls"><button class="control record" onclick="record(${t.id})" ${busy?'disabled':''}>●&nbsp; Record</button><button class="control overdub" onclick="overdub(${t.id})" ${!has||busy?'disabled':''}>＋&nbsp; Overdub</button><button class="control play" onclick="play(${t.id})" ${!has||busy?'disabled':''}>▶&nbsp; Play</button><button class="control" onclick="stop(${t.id})" ${!busy?'disabled':''}>■&nbsp; Stop</button></div><div class="group-title">Loop tools</div><div class="controls"><button class="control" onclick="edit(${t.id},'double')" ${!has||busy?'disabled':''}>×2&nbsp; Double</button><button class="control" onclick="edit(${t.id},'half')" ${!has||busy?'disabled':''}>½&nbsp; Half</button><button class="control" onclick="edit(${t.id},'reverse')" ${!has||busy?'disabled':''}>⇄&nbsp; Reverse</button><button class="control" onclick="undo(${t.id})" ${!t.undo||busy?'disabled':''}>↶&nbsp; Undo</button></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="control delete" style="padding:8px 11px;min-height:34px" onclick="removeTrack(${t.id})">Remove track</button></div>`;root.appendChild(el);if(has)drawWave(t)})}
function getTrack(id){return tracks.find(t=>t.id===id)}
function record(id){const t=getTrack(id);if(!t||!microphone)return;startRecording(t,false)}
function overdub(id){const t=getTrack(id);if(!t||!t.buffer)return;playSource(t);startRecording(t,true)}
function startRecording(t,isOverdub){const input=audioContext.createMediaStreamSource(microphone),destination=audioContext.createMediaStreamDestination();input.connect(destination);let options={};for(const type of ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']){if(MediaRecorder.isTypeSupported(type)){options.mimeType=type;break}}try{t.recorder=new MediaRecorder(destination.stream,options)}catch(e){showError('Recording is not supported by this browser: '+e.message);return}t.chunks=[];t.recorder.ondataavailable=e=>{if(e.data.size)t.chunks.push(e.data)};t.recorder.onstop=()=>{const reader=new FileReader();reader.onload=()=>audioContext.decodeAudioData(reader.result).then(buffer=>{t.undo=t.buffer;t.buffer=isOverdub&&t.buffer?mix(t.buffer,buffer):buffer;t.state='stopped';render()}).catch(()=>{t.state='stopped';render();showError('Could not decode the recording.')});reader.readAsArrayBuffer(new Blob(t.chunks,{type:t.recorder.mimeType||'audio/webm'}))};t.recorder.start(100);t.state=isOverdub?'overdubbing':'recording';render()}
function playSource(t){if(t.source){try{t.source.stop()}catch(e){}}const src=audioContext.createBufferSource(),gain=audioContext.createGain();src.buffer=t.buffer;src.loop=true;gain.gain.value=t.volume;src.connect(gain);gain.connect(audioContext.destination);src.start();t.source=src;t.gain=gain}
function play(id){const t=getTrack(id);if(!t?.buffer)return;playSource(t);t.state='playing';render()}
function stop(id){const t=getTrack(id);if(!t)return;if(t.recorder&&t.recorder.state==='recording'){t.recorder.stop();t.recorder=null}if(t.source){try{t.source.stop()}catch(e){}t.source=null}t.state='stopped';render()}
function setVolume(id,value){const t=getTrack(id);if(!t)return;t.volume=Number(value);if(t.gain)t.gain.gain.value=t.volume;const out=document.getElementById('vol-'+id);if(out)out.value=Math.round(t.volume*100)+'%'}
function mix(a,b){const length=Math.max(a.length,b.length),channels=Math.max(a.numberOfChannels,b.numberOfChannels),out=audioContext.createBuffer(channels,length,a.sampleRate);for(let c=0;c<channels;c++){const dst=out.getChannelData(c),x=a.getChannelData(Math.min(c,a.numberOfChannels-1)),y=b.getChannelData(Math.min(c,b.numberOfChannels-1));for(let i=0;i<length;i++)dst[i]=Math.tanh((x[i]||0)+(y[i]||0))}return out}
function edit(id,action){const t=getTrack(id);if(!t?.buffer)return;t.undo=t.buffer;const old=t.buffer,channels=old.numberOfChannels,length=old.length;let out;if(action==='double'){out=audioContext.createBuffer(channels,length*2,old.sampleRate);for(let c=0;c<channels;c++){const a=old.getChannelData(c),b=out.getChannelData(c);b.set(a);b.set(a,length)}}else if(action==='half'){out=audioContext.createBuffer(channels,Math.max(1,Math.floor(length/2)),old.sampleRate);for(let c=0;c<channels;c++)out.getChannelData(c).set(old.getChannelData(c).subarray(0,out.length))}else{out=audioContext.createBuffer(channels,length,old.sampleRate);for(let c=0;c<channels;c++){const a=old.getChannelData(c),b=out.getChannelData(c);for(let i=0;i<length;i++)b[i]=a[length-1-i]}}t.buffer=out;render()}
function undo(id){const t=getTrack(id);if(!t?.undo)return;[t.buffer,t.undo]=[t.undo,t.buffer];render()}
function removeTrack(id){const t=getTrack(id);if(t?.source){try{t.source.stop()}catch(e){}}if(t?.recorder?.state==='recording')t.recorder.stop();tracks=tracks.filter(x=>x.id!==id);render()}
function drawWave(t){const c=document.getElementById('wave-'+t.id);if(!c||!t.buffer)return;const w=Math.max(1,c.clientWidth),h=Math.max(1,c.clientHeight),dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const data=t.buffer.getChannelData(0),step=Math.max(1,Math.ceil(data.length/w));ctx.strokeStyle='#aeb8c6';ctx.globalAlpha=.85;ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<w;x++){let min=1,max=-1;for(let j=0;j<step;j++){const v=data[x*step+j]||0;min=Math.min(min,v);max=Math.max(max,v)}ctx.moveTo(x,(1-max)*h/2);ctx.lineTo(x,(1-min)*h/2)}ctx.stroke()}
window.addEventListener('resize',()=>tracks.forEach(drawWave));
</script>
</body>
</html>
