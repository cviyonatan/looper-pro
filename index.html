<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOOPER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');

    :root {
      --bg: #f5f7fa;
      --s1: #ffffff;
      --s2: #f0f3f7;
      --s3: #e8ecf2;
      --b1: #d0d8e4;
      --b2: #b8c4d4;
      --dim: #8fa0b8;
      --muted: #6a7f99;
      --t2: #4a6080;
      --text: #1a2a3a;
      --hi: #0a1520;
      --act: #e85d20;
      --rec: #cc3300;
      --recL: #ff4411;
      --play: #2a7a3a;
      --playL: #38a84e;
      --over: #b04010;
      --overL: #e85d20;
      --ice: #5ba8d4;
      --iceL: #7ec4ee;
      --mono: 'IBM Plex Mono', monospace;
      --r: 4px;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
    html { height: 100%; min-height: 100%; overflow: hidden; }
    body {
      height: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    #setup {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 20px;
    }

    .setup-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4em;
      color: var(--dim);
      margin-bottom: 8px;
    }

    .dev-block {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dev-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .2em;
    }

    select {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: var(--s1);
      border: 1.5px solid var(--b2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      border-radius: var(--r);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(90,140,180,.10);
    }

    .mon-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mon-row span {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .14em;
    }

    #startbtn {
      width: 100%;
      max-width: 360px;
      height: 56px;
      background: var(--act);
      border: 2px solid var(--act);
      color: #fff;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3em;
      cursor: pointer;
      border-radius: var(--r);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 12px rgba(232,93,32,.30);
    }

    #startbtn:active {
      background: var(--overL);
      border-color: var(--overL);
    }

    .setup-err {
      font-size: 9px;
      color: var(--recL);
      min-height: 14px;
      text-align: center;
    }

    .tog {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-block;
    }

    .tog input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .tog-t {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--b1);
      border: 1px solid var(--b2);
    }

    .tog input:checked + .tog-t {
      background: rgba(232,93,32,.15);
      border-color: var(--act);
    }

    .tog-k {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dim);
      transition: .18s;
    }

    .tog input:checked ~ .tog-k {
      transform: translateX(16px);
      background: var(--act);
    }

    #app {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #topbar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 2px solid var(--b1);
      flex-shrink: 0;
      gap: 12px;
      background: var(--s1);
      box-shadow: 0 1px 6px rgba(90,140,180,.12);
    }

    .tb-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .35em;
      color: var(--hi);
      flex: 1;
    }

    #tb-mon {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #mon-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--b2);
      transition: .2s;
    }

    #mon-led.on {
      background: var(--act);
      box-shadow: 0 0 6px var(--act);
    }

    #tb-mon span {
      font-size: 8px;
      color: var(--muted);
      letter-spacing: .12em;
    }

    #mbar {
      height: 2px;
      background: var(--bg);
      flex-shrink: 0;
    }

    #mfill {
      height: 100%;
      width: 0%;
      transition: width .05s;
      background: linear-gradient(90deg, var(--iceL), var(--act));
    }

    #scroll-wrap {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
    }

    #scroll-wrap::-webkit-scrollbar { width: 2px; }
    #scroll-wrap::-webkit-scrollbar-thumb { background: var(--b2); }

    #tracks {
      padding: 10px 10px 0;
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 10px;
    }

    #addtrack {
      margin: 8px 10px 16px;
      height: 52px;
      background: transparent;
      border: 1.5px dashed var(--b2);
      color: var(--dim);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .22em;
      cursor: pointer;
      border-radius: var(--r);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    #addtrack:active {
      border-color: var(--ice);
      color: var(--ice);
    }

    .track {
      flex: 0 0 auto;
      background: var(--s1);
      border: 1.5px solid var(--b1);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(90,140,180,.10);
    }

    .track.s-rec { border-color: var(--rec); box-shadow: 0 2px 12px rgba(204,51,0,.15); }
    .track.s-play { border-color: var(--ice); box-shadow: 0 2px 12px rgba(91,168,212,.18); }
    .track.s-over { border-color: var(--overL); box-shadow: 0 2px 12px rgba(232,93,32,.18); }

    .th {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1.5px solid var(--b1);
      background: var(--s2);
    }

    .th-idx {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .18em;
      min-width: 22px;
    }

    .th-st {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: .14em;
      padding: 2px 5px;
      border-radius: 2px;
      background: var(--s3);
      color: var(--muted);
    }

    .s-rec .th-st { background: var(--rec); color: #fff; }
    .s-play .th-st { background: var(--s3); color: var(--act); }
    .s-over .th-st { background: rgba(90,70,40,.3); color: var(--act); }

    .th-dur {
      font-size: 8px;
      color: var(--muted);
      margin-left: auto;
      letter-spacing: .05em;
    }

    .th-del {
      background: transparent;
      border: none;
      color: var(--b2);
      font-size: 12px;
      cursor: pointer;
      padding: 0 2px;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes rp {
      0%, 100% { opacity: .2; }
      50% { opacity: 1; }
    }

    .s-rec .th-idx::after {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--recL);
      margin-left: 4px;
      animation: rp .9s ease-in-out infinite;
      vertical-align: middle;
    }

    .wv {
      position: relative;
      height: 34px;
      background: var(--bg);
      border-bottom: 1px solid var(--b1);
      overflow: hidden;
    }

    .wv canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wv-ph {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--act);
      left: 0;
      display: none;
      pointer-events: none;
    }

    .s-play .wv-ph, .s-over .wv-ph { display: block; }

    .wv-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7px;
      color: var(--b2);
      letter-spacing: .18em;
    }

    .tb {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transport {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .tbtn {
      height: 68px;
      border-radius: 3px;
      border: 1px solid var(--b1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform .07s, filter .1s;
      background: var(--s2);
      color: var(--text);
    }

    .tbtn:active { transform: scale(.9); }
    .tbtn[disabled] { opacity: .12; pointer-events: none; }
    .tbtn i { font-style: normal; font-size: 22px; line-height: 1; }
    .tbtn s { text-decoration: none; font-size: 7px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }

    .t-rec {
      background: rgba(130,35,20,.14);
      border-color: rgba(130,35,20,.5);
      color: var(--recL);
    }

    .t-rec s { color: rgba(200,80,60,.7); }

    .t-over {
      background: rgba(180,64,16,.14);
      border-color: rgba(180,64,16,.45);
      color: var(--overL);
    }

    .t-over s { color: rgba(232,93,32,.7); }

    .t-play {
      background: rgba(70,150,95,.09);
      border-color: rgba(70,150,95,.35);
      color: var(--playL);
    }

    .t-play s { color: rgba(42,122,58,.75); }

    .vrow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rl {
      font-size: 8px;
      color: var(--muted);
      letter-spacing: .1em;
      min-width: 40px;
    }

    .vrow input {
      flex: 1;
      height: 2px;
      accent-color: var(--act);
    }

    .fx {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .fx-btn {
      height: 40px;
      border: 1px solid var(--b1);
      background: var(--s2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .13em;
      cursor: pointer;
      border-radius: 3px;
      -webkit-tap-highlight-color: transparent;
    }

    .fx-btn.on {
      background: rgba(232,93,32,.08);
      border-color: rgba(232,93,32,.35);
      color: var(--act);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 2px;
    }

    .mini {
      font-size: 7px;
      color: var(--muted);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .pill {
      font-size: 7px;
      color: var(--act);
      letter-spacing: .14em;
      border: 1px solid rgba(232,93,32,.35);
      background: rgba(232,93,32,.06);
      border-radius: 999px;
      padding: 4px 6px;
    }

    @media (min-width: 420px) {
      #tracks { padding-inline: 14px; }
      #addtrack { margin-inline: 14px; }
    }
  </style>
</head>
<body>
  <div id="setup">
    <div class="setup-title">LOOPER</div>

    <div class="dev-block">
      <label class="dev-label" for="mic">MICROPHONE</label>
      <select id="mic">
        <option>Built-in Microphone</option>
        <option>iRig / Audio Interface</option>
        <option>USB Audio Device</option>
      </select>
    </div>

    <div class="dev-block">
      <label class="dev-label" for="out">OUTPUT</label>
      <select id="out">
        <option>System Output</option>
        <option>Headphones</option>
        <option>Bluetooth</option>
      </select>
    </div>

    <div class="mon-row">
      <span>MONITOR</span>
      <label class="tog">
        <input type="checkbox" checked />
        <span class="tog-t"></span>
        <span class="tog-k"></span>
      </label>
    </div>

    <button id="startbtn">START SESSION</button>
    <div id="setup-err" class="setup-err"></div>
  </div>

  <div id="app">
    <header id="topbar">
      <div class="tb-title">LOOPER</div>

      <div id="tb-mon" aria-label="toggle monitoring">
        <span id="mon-led" class="on"></span>
        <span>MON</span>
      </div>
    </header>

    <div id="mbar">
      <div id="mfill"></div>
    </div>

    <div id="scroll-wrap">
      <div id="tracks">
        <div class="track s-rec">
          <div class="th">
            <div class="th-idx">01</div>
            <div class="th-st">REC</div>
            <div class="th-dur">00:14</div>
            <button class="th-del" aria-label="delete track">×</button>
          </div>

          <div class="wv">
            <canvas></canvas>
            <div class="wv-ph"></div>
          </div>

          <div class="tb">
            <div class="transport">
              <button class="tbtn t-rec"><i>⏺</i><s>REC</s></button>
              <button class="tbtn t-over"><i>⏱</i><s>OVER</s></button>
              <button class="tbtn t-play"><i>▶</i><s>PLAY</s></button>
            </div>

            <div class="vrow">
              <span class="rl">VOL</span>
              <input type="range" min="0" max="100" value="72" />
            </div>

            <div class="fx">
              <button class="fx-btn on">BLOOM</button>
              <button class="fx-btn">FREEZE</button>
              <button class="fx-btn">DRONE</button>
              <button class="fx-btn">STUTTER</button>
            </div>

            <div class="footer">
              <div class="mini">LIVE</div>
              <div class="pill">READY</div>
            </div>
          </div>
        </div>

        <div class="track s-play">
          <div class="th">
            <div class="th-idx">02</div>
            <div class="th-st">PLAY</div>
            <div class="th-dur">00:28</div>
            <button class="th-del" aria-label="delete track">×</button>
          </div>

          <div class="wv">
            <canvas></canvas>
            <div class="wv-ph"></div>
          </div>

          <div class="tb">
            <div class="transport">
              <button class="tbtn t-rec"><i>⏺</i><s>REC</s></button>
              <button class="tbtn t-over"><i>⏱</i><s>OVER</s></button>
              <button class="tbtn t-play"><i>▶</i><s>PLAY</s></button>
            </div>

            <div class="vrow">
              <span class="rl">VOL</span>
              <input type="range" min="0" max="100" value="64" />
            </div>

            <div class="fx">
              <button class="fx-btn">SCATTER</button>
              <button class="fx-btn on">STUTTER</button>
              <button class="fx-btn">BLOOM</button>
              <button class="fx-btn">DRONE</button>
            </div>

            <div class="footer">
              <div class="mini">LOOP</div>
              <div class="pill">SYNC</div>
            </div>
          </div>
        </div>
      </div>

      <button id="addtrack">+ TRACK</button>
    </div>
  </div>

  <script>
    const setup = document.getElementById('setup');
    const app = document.getElementById('app');
    const startBtn = document.getElementById('startbtn');
    const errBox = document.getElementById('setup-err');

    startBtn.addEventListener('click', () => {
      const mic = document.getElementById('mic');
      if (!mic.value) {
        errBox.textContent = 'No input device selected';
        return;
      }
      setup.style.display = 'none';
      app.style.display = 'flex';
      errBox.textContent = '';
    });

    const monitorToggle = document.getElementById('tb-mon');
    const monLed = document.getElementById('mon-led');
    monitorToggle.addEventListener('click', () => {
      monLed.classList.toggle('on');
    });

    const addTrackBtn = document.getElementById('addtrack');
    const tracks = document.getElementById('tracks');
    addTrackBtn.addEventListener('click', () => {
      const track = document.createElement('div');
      track.className = 'track s-play';
      track.innerHTML = `
        <div class="th">
          <div class="th-idx">${String(tracks.children.length + 1).padStart(2, '0')}</div>
          <div class="th-st">PLAY</div>
          <div class="th-dur">00:00</div>
          <button class="th-del" aria-label="delete track">×</button>
        </div>
        <div class="wv">
          <canvas></canvas>
          <div class="wv-ph"></div>
        </div>
        <div class="tb">
          <div class="transport">
            <button class="tbtn t-rec"><i>⏺</i><s>REC</s></button>
            <button class="tbtn t-over"><i>⏱</i><s>OVER</s></button>
            <button class="tbtn t-play"><i>▶</i><s>PLAY</s></button>
          </div>
          <div class="vrow">
            <span class="rl">VOL</span>
            <input type="range" min="0" max="100" value="50" />
          </div>
          <div class="fx">
            <button class="fx-btn">BLOOM</button>
            <button class="fx-btn">FREEZE</button>
            <button class="fx-btn">DRONE</button>
            <button class="fx-btn">STUTTER</button>
          </div>
          <div class="footer">
            <div class="mini">READY</div>
            <div class="pill">IDLE</div>
          </div>
        </div>
      `;
      tracks.appendChild(track);
    });

    document.body.addEventListener('click', (e) => {
      const del = e.target.closest('.th-del');
      if (del) {
        const track = del.closest('.track');
        if (track) track.remove();
      }

      const fx = e.target.closest('.fx-btn');
      if (fx) {
        fx.classList.toggle('on');
      }
    });
  </script>
</body>
</html>
