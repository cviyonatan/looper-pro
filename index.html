<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOOPER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');

    :root {
      --bg: #f5f7fa;
      --s1: #ffffff;
      --s2: #f0f3f7;
      --s3: #e7ebf1;
      --text: #171a1f;
      --muted: #6c7480;
      --line: rgba(22, 26, 31, 0.12);
      --red: #ff4d4d;
      --green: #2acb7c;
      --amber: #ffbf47;
      --blue: #4da3ff;
      --shadow: 0 30px 90px rgba(17, 23, 31, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 20% 10%, rgba(77, 163, 255, 0.12), transparent 30%),
        radial-gradient(circle at 90% 0%, rgba(42, 203, 124, 0.12), transparent 25%),
        linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%);
    }

    .app {
      width: min(1200px, 100%);
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(23, 26, 31, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255,255,255,0.02));
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      background: rgba(255,255,255,0.22);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(135deg, #171a1f, #3d4758);
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      border-left-color: transparent;
      transform: rotate(45deg);
    }

    .brand-mark::after {
      inset: 10px;
      border-color: rgba(42,203,124,0.9);
      border-left-color: transparent;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(42,203,124,0.7);
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      min-height: 760px;
      position: relative;
      z-index: 1;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      border-right: 1px solid var(--line);
      padding: 18px 16px;
    }

    .panel:last-child {
      border-right: none;
      border-left: 1px solid var(--line);
    }

    .title {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 8px 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title span:nth-child(2) {
      color: var(--text);
      letter-spacing: 0.1em;
    }

    .block {
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(17, 23, 31, 0.06);
      border-radius: var(--radius);
      padding: 16px 14px;
      margin-bottom: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .track-list {
      display: grid;
      gap: 10px;
    }

    .track {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(17,23,31,0.06);
      color: var(--text);
    }

    .track.active {
      background: linear-gradient(135deg, rgba(77,163,255,0.12), rgba(42,203,124,0.12));
      border-color: rgba(77,163,255,0.24);
    }

    .track-index {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 10px;
      color: var(--muted);
      background: rgba(23,26,31,0.04);
    }

    .track-name {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 11px;
      color: var(--muted);
    }

    .mini-meter {
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(255,77,77,0.14), rgba(255,191,71,0.14), rgba(42,203,124,0.14));
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(17,23,31,0.04);
    }

    .mini-meter::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(17,23,31,0.08) 0,
        rgba(17,23,31,0.08) 2px,
        transparent 2px,
        transparent 8px
      );
    }

    .mini-meter::after {
      content: "";
      position: absolute;
      left: 12%;
      top: 8px;
      bottom: 8px;
      width: 58%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--red), var(--amber), var(--green));
      box-shadow: 0 0 18px rgba(42, 203, 124, 0.24);
    }

    .center {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 18px 22px 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
    }

    .transport {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(17,23,31,0.06);
    }

    .tempo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tempo-value {
      font-size: 34px;
      letter-spacing: 0.05em;
      color: var(--text);
      font-weight: 700;
      margin-left: 6px;
    }

    .mode {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(17, 23, 31, 0.04);
      border-radius: 999px;
      padding: 6px;
      border: 1px solid rgba(17,23,31,0.05);
    }

    .chip {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chip.active {
      background: var(--text);
      color: #fff;
      box-shadow: 0 12px 30px rgba(23,26,31,0.18);
    }

    .phase {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      margin: 18px 0 8px;
    }

    .phase-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 11px;
    }

    .phase-bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(17, 23, 31, 0.06);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(17,23,31,0.04);
    }

    .phase-bar::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 52%;
      background: linear-gradient(90deg, var(--blue), var(--green));
      border-radius: inherit;
      box-shadow: 0 0 18px rgba(77,163,255,0.25);
    }

    .phase-bar::after {
      content: "";
      position: absolute;
      left: 52%;
      top: 1px;
      bottom: 1px;
      width: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 1px rgba(17,23,31,0.08);
    }

    .host {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 10px;
    }

    .host-card {
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(17,23,31,0.06);
      border-radius: 20px;
      padding: 16px 14px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .host-card .small {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .host-card .big {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-top: 10px;
    }

    .host-card .meta {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .meter-panel {
      margin-top: 16px;
      background: rgba(255,255,255,0.34);
      border: 1px solid rgba(17,23,31,0.06);
      border-radius: 22px;
      padding: 14px 18px 18px;
    }

    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(28, 1fr);
      gap: 6px;
      align-items: end;
      height: 110px;
      padding: 10px 4px 0;
      background: linear-gradient(180deg, rgba(17,23,31,0.02), rgba(17,23,31,0.02));
      border-radius: 14px;
    }

    .bar {
      border-radius: 999px 999px 0 0;
      background: linear-gradient(180deg, #95d9ff, #4da3ff 30%, #26b970 100%);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.22);
      opacity: 0.75;
    }

    .bar:nth-child(odd) { opacity: 0.9; }
    .bar:nth-child(3n) { opacity: 1; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 10px 6px;
    }

    .circle-btn {
      width: 60px;
      height: 60px;
      border: 1px solid rgba(17,23,31,0.07);
      border-radius: 50%;
      background: rgba(255,255,255,0.42);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .circle-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(17,23,31,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .circle-btn.primary {
      width: 86px;
      height: 86px;
      background: linear-gradient(135deg, #171a1f, #2d3747);
      color: white;
      border: none;
      box-shadow: 0 18px 35px rgba(17,23,31,0.14);
    }

    .circle-btn.red {
      background: linear-gradient(135deg, rgba(255,77,77,0.14), rgba(255,77,77,0.04));
      border-color: rgba(255,77,77,0.15);
    }

    .circle-btn.green {
      background: linear-gradient(135deg, rgba(42,203,124,0.18), rgba(42,203,124,0.05));
      border-color: rgba(42,203,124,0.18);
    }

    .label {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 16px;
    }

    .round-box {
      background: rgba(255,255,255,0.36);
      border: 1px solid rgba(17,23,31,0.06);
      border-radius: 22px;
      padding: 14px;
    }

    .dial {
      width: 120px;
      height: 120px;
      margin: 10px auto 8px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9) 0 28%, rgba(17,23,31,0.06) 29% 100%),
        conic-gradient(from 180deg, var(--red), var(--amber), var(--green), var(--blue), var(--red));
      position: relative;
      border: 1px solid rgba(17,23,31,0.08);
      box-shadow: inset 0 0 30px rgba(255,255,255,0.6), 0 16px 24px rgba(17,23,31,0.08);
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(17,23,31,0.06);
    }

    .dial::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 42px;
      background: var(--text);
      left: 50%;
      top: 14px;
      transform: translateX(-50%) rotate(35deg);
      transform-origin: 50% 100%;
      border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
    }

    .levels {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .level-row {
      display: grid;
      grid-template-columns: 64px 1fr 32px;
      gap: 10px;
      align-items: center;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .rail {
      height: 10px;
      border-radius: 999px;
      background: rgba(17,23,31,0.06);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(17,23,31,0.04);
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 60%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
    }

    .fill:nth-child(2) { width: 72%; }
    .fill:nth-child(3) { width: 48%; }

    .session {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .session strong {
      font-size: 18px;
      color: var(--text);
      letter-spacing: 0.06em;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel:last-child {
        border-left: none;
        border-top: 1px solid var(--line);
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .host {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <span>Looper</span>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>READY</span>
      </div>
    </div>

    <div class="layout">
      <aside class="panel">
        <div class="title"><span>tracks</span><span>04</span></div>

        <div class="block">
          <div class="track-list">
            <div class="track active">
              <div class="track-index">1</div>
              <div class="track-name">Lead Loop</div>
              <div class="track-time">00:16</div>
            </div>
            <div class="track">
              <div class="track-index">2</div>
              <div class="track-name">Bassline</div>
              <div class="track-time">00:18</div>
            </div>
            <div class="track">
              <div class="track-index">3</div>
              <div class="track-name">Drums</div>
              <div class="track-time">00:14</div>
            </div>
            <div class="track">
              <div class="track-index">4</div>
              <div class="track-name">FX</div>
              <div class="track-time">00:09</div>
            </div>
          </div>
        </div>

        <div class="title"><span>input</span><span>line</span></div>
        <div class="block">
          <div class="mini-meter" aria-label="Input meter"></div>
        </div>
      </aside>

      <main class="center">
        <div class="transport">
          <div class="tempo">
            <span>tempo</span>
            <span class="tempo-value">96</span>
          </div>

          <div class="mode" aria-label="Modes">
            <button class="chip active">live</button>
            <button class="chip">record</button>
            <button class="chip">overdub</button>
          </div>
        </div>

        <div class="phase">
          <div class="phase-label">in</div>
          <div class="phase-bar" aria-hidden="true"></div>
          <div class="phase-label">out</div>
        </div>

        <div class="host">
          <div class="host-card">
            <div class="small">cycle</div>
            <div>
              <div class="big">04</div>
            </div>
            <div class="meta"><span>bars</span><span>1:00</span></div>
          </div>

          <div class="host-card">
            <div class="small">loop</div>
            <div>
              <div class="big">16</div>
            </div>
            <div class="meta"><span>beats</span><span>0:16</span></div>
          </div>

          <div class="host-card">
            <div class="small">latency</div>
            <div>
              <div class="big">12</div>
            </div>
            <div class="meta"><span>ms</span><span>stable</span></div>
          </div>
        </div>

        <div class="meter-panel">
          <div class="meter-head">
            <span>signal</span>
            <span>input</span>
          </div>

          <div class="bars" aria-label="Level meter">
            <div class="bar" style="height: 36%"></div>
            <div class="bar" style="height: 46%"></div>
            <div class="bar" style="height: 60%"></div>
            <div class="bar" style="height: 52%"></div>
            <div class="bar" style="height: 68%"></div>
            <div class="bar" style="height: 80%"></div>
            <div class="bar" style="height: 58%"></div>
            <div class="bar" style="height: 70%"></div>
            <div class="bar" style="height: 90%"></div>
            <div class="bar" style="height: 62%"></div>
            <div class="bar" style="height: 75%"></div>
            <div class="bar" style="height: 48%"></div>
            <div class="bar" style="height: 84%"></div>
            <div class="bar" style="height: 64%"></div>
            <div class="bar" style="height: 54%"></div>
            <div class="bar" style="height: 88%"></div>
            <div class="bar" style="height: 66%"></div>
            <div class="bar" style="height: 72%"></div>
            <div class="bar" style="height: 42%"></div>
            <div class="bar" style="height: 52%"></div>
            <div class="bar" style="height: 78%"></div>
            <div class="bar" style="height: 61%"></div>
            <div class="bar" style="height: 73%"></div>
            <div class="bar" style="height: 39%"></div>
            <div class="bar" style="height: 60%"></div>
            <div class="bar" style="height: 86%"></div>
            <div class="bar" style="height: 58%"></div>
            <div class="bar" style="height: 66%"></div>
            <div class="bar" style="height: 48%"></div>
          </div>
        </div>

        <div class="controls">
          <button class="circle-btn red" aria-label="Stop">■</button>
          <button class="circle-btn" aria-label="Rewind">⏮</button>
          <button class="circle-btn primary" aria-label="Play">▶</button>
          <button class="circle-btn green" aria-label="Record">◉</button>
          <button class="circle-btn" aria-label="Forward">⏭</button>
        </div>

        <div class="label">
          <span>stop</span>
          <span>back</span>
          <span>play</span>
          <span>record</span>
          <span>next</span>
        </div>
      </main>

      <aside class="right-panel">
        <div class="round-box">
          <div class="title"><span>master</span><span>gain</span></div>
          <div class="dial" aria-label="Master output dial"></div>
        </div>

        <div class="round-box">
          <div class="title"><span>levels</span><span>mix</span></div>
          <div class="levels">
            <div class="level-row">
              <span>input</span>
              <div class="rail"><div class="fill"></div></div>
              <span>60</span>
            </div>
            <div class="level-row">
              <span>loop</span>
              <div class="rail"><div class="fill"></div></div>
              <span>72</span>
            </div>
            <div class="level-row">
              <span>mix</span>
              <div class="rail"><div class="fill"></div></div>
              <span>48</span>
            </div>
          </div>
        </div>

        <div class="round-box">
          <div class="session">
            <span>session</span>
            <strong>004</strong>
          </div>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
